<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ASCEND</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0e0d;--cd:#191a18;--ink:#ecebe4;--mut:#9a9c92;--ln:#2c2e2a;--ol:#9aa571;--ol2:#262a1d;--bad:#d08a76;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0d0e0d;--cd:#191a18;--ink:#ecebe4;--mut:#9a9c92;--ln:#2c2e2a;--ol:#9aa571;--ol2:#262a1d;--bad:#d08a76;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 Archivo,system-ui,sans-serif;background-color:var(--bg)}
main{max-width:860px;margin:auto;padding:20px 16px 110px}h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}h1{font-size:30px;line-height:1.15}h2{font-size:22px;margin:4px 0 14px}h3{font-size:13px;color:var(--mut);font-weight:500;margin-bottom:10px}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:12px}.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g>.c{margin:0}
small,.m{color:var(--mut);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:transparent;color:var(--ink);border-radius:8px;padding:7px 12px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ol);outline-offset:2px}
.pri{background:var(--ol);border-color:var(--ol);color:#fff}.gh{color:var(--mut)}.bad{color:var(--bad);border-color:var(--bad)}.sm{padding:3px 9px;font-size:13px}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}.it:last-child{border:0}.it span{flex:1}.it.dn span{text-decoration:line-through;color:var(--mut)}
.ck{width:22px;height:22px;padding:0;border-radius:6px;font-size:13px;flex:none;line-height:1}.dn .ck{background:var(--ol);color:#fff;border-color:var(--ol)}
.big{font-size:34px;font-weight:600;line-height:1}.ring{position:relative;width:96px;height:96px}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:600}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.bars i{display:block;background:var(--ol);border-radius:4px 4px 0 0;min-height:2px;margin-bottom:4px;transition:height .5s}
.seg{display:flex;gap:4px;margin-bottom:14px;overflow:auto}.seg button.on,nav button.on{background:var(--ol2);color:var(--ol);border-color:var(--ol)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--cd);border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:4px;z-index:5}nav button{flex:1;border:1px solid transparent;font-size:13px;padding:9px 2px}
.quote{border-left:3px solid var(--ol);padding-left:12px;font-size:17px}.tag{font-size:12px;border:1px solid var(--ln);border-radius:20px;padding:1px 8px;color:var(--mut)}.od{color:var(--bad)}
input,select,textarea{font:inherit;width:100%;padding:8px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--ink)}label{display:block;margin-bottom:10px;font-size:13px;color:var(--mut)}
#m{display:none;position:fixed;inset:0;background:#000a;z-index:9;align-items:center;justify-content:center;padding:16px}#m.on{display:flex}.mf{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:18px;width:100%;max-width:420px;max-height:90%;overflow:auto}.mf h3{font-size:17px;color:var(--ink)}
#t{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ol);color:#fff;padding:8px 14px;border-radius:8px;z-index:10;display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cd{border:1px solid var(--ln);border-radius:6px;min-height:46px;font-size:12px;padding:3px}.cd.now{border-color:var(--ol);background:var(--ol2)}.cd b{display:block;color:var(--ol);font-weight:500}.cd u{display:block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin:2px auto}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.ph img{width:100%;border-radius:8px;display:block}
.sk{width:100%;overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--ln);text-align:left;font-weight:400}a{color:var(--ol)}
.ai-box{border:1px dashed var(--ol);background:var(--ol2);border-radius:10px;padding:12px;margin-top:10px;white-space:pre-wrap;font-size:14px;line-height:1.6}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--ln);border-top-color:var(--ol);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:820px){nav{top:0;bottom:auto;right:auto;width:150px;flex-direction:column;border:0;border-right:1px solid var(--ln);padding:24px 10px}main{margin-left:calc(50% - 330px);margin-right:auto;padding-bottom:40px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<nav id="n"></nav><main id="v"></main><div id="m"></div><div id="t"></div>
<script src="ai_study_ui.js"></script>
<script src="ai_service.js"></script>
<script>
const K='ascend.v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),iso=d=>d.toLocaleDateString('en-CA'),td=()=>iso(new Date()),dd=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)},dow=d=>new Date(d+'T12:00').getDay(),DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0),pc=(a,b)=>b?Math.round(a/b*100):0;
let S,ui={tab:'home',sub:{study:'plan',health:'nut',tasks:'day',news:'All'},fm:0,ip:'week'};
const aiState={home:'',tasks:'',study:'',quiz:'',health:'',fitness:'',insights:'',quizTopic:''};
const CATS=['Study','Personal','Fitness','Grooming','Other'],V={};

function seed(){const d=td(),y=dd(1),I=a=>a.map(x=>({id:uid(),...x}));
const sy=[['Part 1','A. External Financial Reporting','Financial statements & GAAP basics'],['Part 1','A. External Financial Reporting','Revenue recognition'],['Part 1','B. Planning, Budgeting & Forecasting','Budget systems'],['Part 1','B. Planning, Budgeting & Forecasting','Forecasting techniques'],['Part 1','C. Performance Management','Responsibility centers'],['Part 1','D. Cost Management','Costing systems'],['Part 1','D. Cost Management','Variance analysis'],['Part 1','E. Internal Controls','Governance & risk'],['Part 1','F. Technology & Analytics','Data analytics'],['Part 2','A. Financial Statement Analysis','Ratio analysis'],['Part 2','B. Corporate Finance','Risk & return'],['Part 2','B. Corporate Finance','Cost of capital'],['Part 2','C. Decision Analysis','CVP analysis'],['Part 2','D. Risk Management','Enterprise risk'],['Part 2','E. Investment Decisions','Capital budgeting'],['Part 2','F. Professional Ethics','IMA ethics standards']];
return{name:'',theme:'dark',sample:1,wgoal:8,pgoal:120,sgoal:3,exam:'',
tasks:I([{t:'Review Part 1 Section B notes',cat:'Study',due:d,pri:'High',rem:'19:00',done:0},{t:'Meal prep for the week',cat:'Personal',due:d,pri:'Medium',rem:'',done:0},{t:'Book a haircut',cat:'Grooming',due:y,pri:'Low',rem:'',done:0},{t:'Leg day session',cat:'Fitness',due:d,pri:'High',rem:'07:00',done:0}]),
habits:I([{t:'Read 20 minutes'},{t:'Sleep by 11 pm'},{t:'No phone first hour'},{t:'Plan tomorrow'}]),hlog:{},
rem:I([{t:'Study session',time:'18:00',days:'daily'},{t:'Gym session',time:'07:00',days:'1,3,5'},{t:'Night skincare',time:'22:00',days:'daily'},{t:'Drink water',time:'11:00',days:'daily'},{t:'Sleep schedule: wind down',time:'22:30',days:'daily'}]),
water:{},prot:{},fv:{},food:{},foodList:['Fruit','Vegetables','Protein at each meal','Nuts & seeds','Healthy fats','Whole grains','No sugary drinks'],
syl:I(sy.map(([part,sub,ch])=>({part,sub,ch,done:0,rev:0,tgt:''}))),slog:[],mocks:[],ev:[],
tt:{0:'Revision · 2h',1:'Part 1 · 3h',2:'Part 1 · 3h',3:'Part 2 · 3h',4:'Part 2 · 3h',5:'Practice MCQs · 2h',6:'Weekly review · 2h'},
groom:{skin:'Combination',hair:'Straight',am:['Face wash','Moisturizer','Sunscreen SPF 30+'],pm:['Face wash','Moisturizer'],glog:{},wk:I([{t:'Exfoliate',every:7,last:''},{t:'Wash hair',every:2,last:''},{t:'Hair oiling',every:7,last:''},{t:'Beard trim',every:7,last:''},{t:'Haircut',every:30,last:''}]),cond:[],photos:[]},
fit:{plan:{0:'Rest',1:'Push',2:'Pull',3:'Legs',4:'Rest',5:'Push',6:'Cardio'},wk:[],bw:[],goals:I([{t:'Train 4 times per week',done:0}])},news:[]}}

const load=()=>{try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed()},save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Storage is full. Delete some photos.')}};
function toast(s){const t=$('#t');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function F(title,fs,cb,del){const m=$('#m');m.innerHTML=`<form class=mf><h3>${title}</h3>${fs.map(f=>`<label>${f.l}${f.t=='select'?`<select name="${f.k}">${f.o.map(o=>`<option ${o==f.v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:f.t=='area'?`<textarea name="${f.k}" rows=5>${esc(f.v)}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" step=any value="${esc(f.v)}" ${f.r?'required':''}>`}</label>`).join('')}<div class=row><button class=pri>Save</button><button type=button class=gh onclick="X()">Cancel</button>${del?'<button type=button class=bad onclick="DX()">Delete</button>':''}</div></form>`;m.className='on';window.DX=()=>{del();X();save();render()};m.querySelector('input,select,textarea')?.focus();m.querySelector('form').onsubmit=e=>{e.preventDefault();cb(Object.fromEntries(new FormData(e.target)));X();save();render()}}
const X=()=>$('#m').className='';
const chk=(on,fn,txt,sub='')=>`<div class="it ${on?'dn':''}"><button class=ck onclick="${fn}" aria-label="Toggle">${on?'✓':''}</button><span>${esc(txt)}</span>${sub}</div>`;
const ring=p=>`<div class=ring><svg viewBox="0 0 96 96" width=96 height=96><circle cx=48 cy=48 r=40 fill=none stroke="var(--ln)" stroke-width=7 /><circle cx=48 cy=48 r=40 fill=none stroke="var(--ol)" stroke-width=7 stroke-linecap=round stroke-dasharray=251.3 stroke-dashoffset="${251.3*(1-p/100)}" transform="rotate(-90 48 48)" style="transition:stroke-dashoffset .6s"/></svg><b>${p}%</b></div>`;
const bars=a=>`<div class=bars>${a.map(x=>`<div title="${x.t||''}"><i style="height:${Math.max(2,x.v*.7)}px"></i>${x.l}</div>`).join('')}</div>`;
const card=(t,b,x='')=>`<section class=c><div class="row sp"><h3>${t}</h3>${x}</div>${b}</section>`;
const empty=s=>`<p class=m>${s}</p>`;
const seg=(k,o)=>`<div class=seg>${o.map(([i,l])=>`<button class="${ui.sub[k]==i?'on':''}" onclick="ui.sub.${k}='${i}';render()">${l}</button>`).join('')}</div>`;

/* Metrics & Calculations */
const studyH=d=>sum(S.slog.filter(l=>l.d==d).map(l=>+l.h)),planned=d=>{const p=S.fit.plan[dow(d)];return p&&p!='Rest'};
function comps(d){const c=[],T=S.tasks.filter(t=>t.due==d);if(T.length)c.push(T.filter(t=>t.done).length/T.length);
if(S.habits.length)c.push((S.hlog[d]||[]).filter(i=>S.habits.some(h=>h.id==i)).length/S.habits.length);
c.push(Math.min(1,(S.water[d]||0)/S.wgoal));c.push(Math.min(1,studyH(d)/S.sgoal));if(planned(d))c.push(S.fit.wk.some(w=>w.d==d)?1:0);
const g=S.groom.glog[d]||{am:[],pm:[]},tot=S.groom.am.length+S.groom.pm.length;if(tot)c.push((g.am.length+g.pm.length)/tot);return c}
const score=d=>{const c=comps(d);return Math.round(sum(c)/c.length*100)};
const streak=()=>{let n=0,i=studyH(td())>0?0:1;while(studyH(dd(i))>0){n++;i++}return n};
function M(n,off=0){const ds=[];for(let i=n+off-1;i>=off;i--)ds.push(dd(i));const T=S.tasks.filter(t=>ds.includes(t.due)),g=S.groom,steps=g.am.length+g.pm.length;
const sh=sum(ds.map(studyH)),gy=S.fit.wk.filter(w=>ds.includes(w.d)).length,gp=ds.filter(planned).length,hd=sum(ds.map(d=>(S.hlog[d]||[]).filter(i=>S.habits.some(h=>h.id==i)).length)),gd=sum(ds.map(d=>{const l=g.glog[d];return l?l.am.length+l.pm.length:0}));
return{ds,sc:ds.map(score),avg:Math.round(sum(ds.map(score))/n),sh,st:S.sgoal*n,sdays:ds.filter(d=>studyH(d)>0).length,tT:T.length,tD:T.filter(t=>t.done).length,miss:T.filter(t=>!t.done&&t.due<td()),gy,gp,hab:pc(hd,S.habits.length*n),grm:pc(gd,steps*n),act:ds.some(d=>studyH(d)||S.water[d]||(S.hlog[d]||[]).length||S.fit.wk.some(w=>w.d==d)||S.tasks.some(t=>t.doneOn==d))}}

/* Reminders & Notifications */
const remDue=d=>S.rem.filter(r=>r.days=='daily'||r.days.split(',').includes(String(dow(d)))).sort((a,b)=>a.time.localeCompare(b.time));
setInterval(()=>{const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes()),d=td(),L=[...remDue(d).filter(r=>r.time==hm).map(r=>r.t),...S.tasks.filter(t=>!t.done&&t.due==d&&t.rem==hm).map(t=>'Task: '+t.t)];
L.forEach(t=>{const k='f'+d+hm+t;if(sessionStorage[k])return;sessionStorage[k]=1;toast('Reminder: '+t);if(window.Notification&&Notification.permission=='granted')new Notification('ASCEND',{body:t})})},20000);

/* AI Card Renderer & Helpers */
function copyText(str){
  if(!str)return;
  navigator.clipboard.writeText(str).then(()=>toast('Copied AI response to clipboard'));
}
function clearAIHistory(){
  Object.keys(aiState).forEach(k=>aiState[k]='');
  toast('AI response history cleared');
  render();
}

function renderAICard(id, title, stateKey, onGenerateFn) {
  const content = aiState[stateKey];
  const hasContent = Boolean(content && !content.includes('spinner'));
  return card(
    `✨ AI ${title}`,
    `<div>
      <div class="row sp" style="margin-bottom:8px">
        <small class="m">Qwen 2.5 3B (Local Ollama)</small>
        <div class="row">
          <button class="sm pri" onclick="${onGenerateFn}">${hasContent?'Regenerate':'Generate'}</button>
          ${hasContent ? `<button class="sm gh" onclick="copyText(aiState['${stateKey}'])">Copy</button>` : ''}
        </div>
      </div>
      <div id="${id}-out" class="${hasContent?'ai-box':'m'}">
        ${content || 'Click generate to analyze your data with local AI.'}
      </div>
    </div>`
  );
}

// ---- VIEWS
const QUOTES=['Discipline is doing the plan after the mood has left.','Small reps, repeated daily, decide the year.','Show up before you feel ready.','Today’s work is tomorrow’s confidence.','Keep the promise you made to yourself this morning.','Consistency beats intensity you cannot repeat.','Do the next right thing, then the one after.','Rest is part of the plan, not a break from it.'];

V.home=()=>{
  const d=td(),h=new Date().getHours(),T=S.tasks.filter(t=>t.due==d),tp=pc(T.filter(t=>t.done).length,T.length),wk=S.fit.wk.find(w=>w.d==d),pl=S.fit.plan[dow(d)],hl=S.hlog[d]||[],nowt=pad(new Date().getHours())+':'+pad(new Date().getMinutes()),
  ev=S.ev.filter(e=>e.d>=d&&e.d<=dd(-7)).sort((a,b)=>a.d.localeCompare(b.d));
  return`<p class=m>${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p><h1>${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}${S.name?', '+esc(S.name):''}.</h1><p class=quote style="margin:14px 0 18px">${QUOTES[Math.floor(Date.now()/864e5)%8]}</p>
  ${renderAICard('home-ai', 'Daily Planner', 'home', 'runAIDailyPlan()')}
  <div class=g>${card('Productivity score',`<div class=row>${ring(score(d))}<small>Average of today’s tasks, habits, water, study, workout and grooming.</small></div>`)}
  ${card('Tasks today',`<div class=row>${ring(tp)}<small>${T.filter(t=>t.done).length} of ${T.length} done</small></div>`)}
  ${card('Study hours',`<div class=big>${studyH(d)}<small> / ${S.sgoal} h</small></div><div class=row style="margin-top:10px"><button onclick="logStudy()">Log hours</button><small>Streak: ${streak()} days</small></div>`)}
  ${card('Workout',`<div class=big style="font-size:22px">${wk?'Done: '+esc(wk.cat)+' '+wk.dur+' min':pl=='Rest'?'Rest day':esc(pl)+' planned'}</div><button style="margin-top:10px" onclick="go('fitness')">${wk?'View log':'Log workout'}</button>`)}</div>
  <div style="height:12px"></div><div class=g>
  ${card('Daily habits',S.habits.length?S.habits.map(x=>chk(hl.includes(x.id),`th('${x.id}')`,x.t,`<button class="sm gh" onclick="eh('${x.id}')">Edit</button>`)).join(''):empty('No habits yet. Add one to start tracking.'),'<button class="sm" onclick="eh()">Add</button>')}
  ${card('Upcoming reminders',remDue(d).length||ev.length?remDue(d).map(r=>`<div class=it><span class="${r.time<nowt?'m':''}">${r.time} ${esc(r.t)}</span><button class="sm gh" onclick="er('${r.id}')">Edit</button></div>`).join('')+ev.map(e=>`<div class=it><span>${e.d} ${esc(e.type)}: ${esc(e.t)}</span></div>`).join(''):empty('No reminders today.'),'<button class="sm" onclick="er()">Add</button>')}
  ${card('Water',`<div class=row><button onclick="wa(-1)">−</button><span class=big>${S.water[d]||0}</span><button onclick="wa(1)">+</button><small>of ${S.wgoal} glasses</small></div>`)}
  ${card('Nutrition checklist',S.foodList.map(f=>chk((S.food[d]||[]).includes(f),`tf(${JSON.stringify(f).replace(/"/g,'&quot;')})`,f)).join(''))}</div>
  ${card('Weekly progress',bars(M(7).ds.map(x=>({l:DN[dow(x)][0],v:score(x),t:score(x)+'%'}))))}
  ${card('Settings & Privacy',`<div class=row><button onclick="settings()">Profile & goals</button><button onclick="notif()">Enable notifications</button><button onclick="S.theme=S.theme=='dark'?'light':'dark';save();render()">Theme</button><button onclick="clearAIHistory()">Clear AI History</button>${S.sample?'<button class=bad onclick="clearSample()">Clear sample data</button>':''}</div><p class=m>Data is stored locally in this browser. Local AI queries run entirely on your machine.</p>`)}`;
};

async function runAIDailyPlan(){
  aiState.home = '<span class="spinner"></span> Generating your custom plan...';
  render();
  try {
    const data = {
      name: S.name,
      today: td(),
      sgoal: S.sgoal,
      fitPlanToday: S.fit.plan[dow(td())],
      pendingTasks: S.tasks.filter(t => !t.done).map(t=>({task:t.t, priority:t.pri, due:t.due})),
      habits: S.habits.map(h=>h.t)
    };
    aiState.home = await window.aiService.generateDailyPlan(data);
  } catch (err) {
    aiState.home = '⚠️ AI Error: ' + err.message;
  }
  render();
}

const tg=id=>{const t=S.tasks.find(x=>x.id==id);t.done=t.done?0:1;t.doneOn=t.done?td():'';save();render()};
const th=id=>{const d=td(),l=S.hlog[d]=S.hlog[d]||[],i=l.indexOf(id);i<0?l.push(id):l.splice(i,1);save();render()};
const tf=f=>{const d=td(),l=S.food[d]=S.food[d]||[],i=l.indexOf(f);i<0?l.push(f):l.splice(i,1);save();render()};
const wa=n=>{const d=td();S.water[d]=Math.max(0,(S.water[d]||0)+n);save();render()};
function eh(id){const h=S.habits.find(x=>x.id==id);F(h?'Edit habit':'New habit',[{k:'t',l:'Habit',v:h?.t,r:1}],o=>h?h.t=o.t:S.habits.push({id:uid(),t:o.t}),h&&(()=>S.habits=S.habits.filter(x=>x!=h)))}
function er(id){const r=S.rem.find(x=>x.id==id);F(r?'Edit reminder':'New reminder',[{k:'t',l:'Reminder',v:r?.t,r:1},{k:'time',l:'Time',t:'time',v:r?.time||'18:00',r:1},{k:'days',l:'Days (e.g. daily, 1,3,5)',v:r?.days||'daily'}],o=>r?Object.assign(r,o):S.rem.push({id:uid(),...o}),r&&(()=>S.rem=S.rem.filter(x=>x!=r)))}

function ew2(id){const w=S.fit.wk.find(x=>x.id==id);F(w?'Edit workout':'Log workout',[{k:'d',l:'Date',t:'date',v:w?.d||td()},{k:'cat',l:'Category',t:'select',o:FC,v:w?.cat||'Push'},{k:'dur',l:'Duration (min)',t:'number',v:w?.dur||60}],o=>{const r={d:o.d,cat:o.cat,dur:+o.dur,ex:[]};w?Object.assign(w,r):S.fit.wk.push({id:uid(),...r})})}
const ebw=()=>F('Log body weight',[{k:'d',l:'Date',t:'date',v:td()},{k:'kg',l:'Weight (kg)',t:'number',r:1}],o=>{S.fit.bw=S.fit.bw.filter(x=>x.d!=o.d);S.fit.bw.push(o)});

/* INSIGHTS VIEW */
V.insights=()=>{
  const n=ui.ip=='week'?7:30,a=M(n),p=M(n,n),L=[];
  const hasT=a.tT>0;
  if(!a.act)return`<h2>Insights</h2>${seg2()}${card('No activity yet',empty('Log tasks, study, workouts and habits to generate insights.'))}`;
  L.push(`Study logged: ${a.sh}/${a.st} hrs (${pc(a.sh,a.st)}%) across ${a.sdays}/${n} days.`);
  L.push(hasT?`Completed ${a.tD}/${a.tT} tasks (${pc(a.tD,a.tT)}%). ${a.miss.length?a.miss.length+' overdue.':'None overdue.'}`:'No tasks with deadlines.');
  L.push(a.gp?`Trained ${a.gy}/${a.gp} planned sessions (${pc(a.gy,a.gp)}%).`:'No planned sessions.');
  const low=[['study',pc(a.sh,a.st)],['habits',a.hab],['grooming',a.grm],...(a.gp?[['gym',pc(a.gy,a.gp)]]:[])].sort((x,y)=>x[1]-y[1])[0];
  const dl=a.avg-p.avg;
  return`<h2>Insights</h2>${seg2()}
  ${renderAICard('insights-ai', 'Weekly Synthesis & Productivity Review', 'insights', 'runAIWeeklyInsights()')}
  <div class=g>${card('Average productivity',`<div class=row>${ring(a.avg)}<small>${p.act?(dl>=0?'Up ':'Down ')+Math.abs(dl)+' pts vs prior period':'No baseline'}</small></div>`)}
  ${card('Task completion',`<div class=big>${hasT?pc(a.tD,a.tT):'-'}<small>%</small></div><small>${a.tD}/${a.tT} done</small>`)}${card('Study consistency',`<div class=big>${pc(a.sdays,n)}<small>% of days</small></div>`)}
  ${card('Gym consistency',`<div class=big>${a.gp?pc(a.gy,a.gp):'-'}<small>%</small></div>`)}${card('Habits',`<div class=big>${a.hab}<small>%</small></div>`)}</div><div style="height:12px"></div>
  ${card('Daily scores',n==7?bars(a.ds.map((x,i)=>({l:DN[dow(x)][0],v:a.sc[i],t:a.sc[i]+'%'}))):bars(a.ds.map((x,i)=>({l:i%5==0?x.slice(8):'',v:a.sc[i]}))))}
  ${card('Feedback',L.map(x=>`<div class=it><span>${x}</span></div>`).join(''))}`;
};

const seg2=()=>`<div class=seg>${[['week','Weekly report'],['month','Monthly report']].map(([i,l])=>`<button class="${ui.ip==i?'on':''}" onclick="ui.ip='${i}';render()">${l}</button>`).join('')}</div>`;

async function runAIWeeklyInsights(){
  aiState.insights = '<span class="spinner"></span> Synthesizing weekly performance metrics...';
  render();
  try {
    const n = ui.ip === 'week' ? 7 : 30;
    const a = M(n);
    const p = M(n, n);
    const low = [['study', pc(a.sh, a.st)], ['habits', a.hab], ['grooming', a.grm], ...(a.gp ? [['gym', pc(a.gy, a.gp)]] : [])].sort((x, y) => x[1] - y[1])[0];
    const data = {
      period: n,
      avgScore: a.avg,
      prevScore: p.avg || 0,
      studyHours: a.sh,
      targetStudyHours: a.st,
      completedTasks: a.tD,
      totalTasks: a.tT,
      missedTasks: a.miss.length,
      gymSessions: a.gy,
      plannedGym: a.gp,
      habitRate: a.hab,
      grmRate: a.grm,
      lowestDimension: low[0]
    };
    aiState.insights = await window.aiService.generateWeeklyInsights(data);
  } catch (err) {
    aiState.insights = '⚠️ AI Error: ' + err.message;
  }
  render();
}
